<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Game Sequencer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100%;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .sequencer-container {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
            gap: 20px;
        }

        .status-text {
            color: #6c757d;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .main-display {
            font-size: clamp(3rem, 20dvw, 6rem);
            font-weight: 900;
            color: #0d6efd;
            line-height: 1;
            text-align: center;
        }

        .btn-game {
            width: 100%;
            max-width: 400px;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.15s;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-game:active {
            opacity: 0.85;
        }

        .btn-game:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .btn-primary {
            color: #fff;
            background: #0d6efd;
        }

        .btn-dark {
            color: #fff;
            background: #212529;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            border-radius: 24px;
            padding: 40px 32px 32px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .modal-label {
            color: #6c757d;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .modal-number {
            font-size: clamp(3rem, 15dvw, 5rem);
            font-weight: 900;
            color: #0d6efd;
            line-height: 1;
            margin-bottom: 32px;
        }

        .btn-close-modal {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            background: #e9ecef;
            color: #212529;
            transition: opacity 0.15s;
            min-height: 50px;
        }

        .btn-close-modal:active {
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            .sequencer-container {
                padding: 32px 20px;
                padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
                gap: 16px;
            }

            .btn-game {
                padding: 16px;
                font-size: 1.1rem;
                border-radius: 12px;
                min-height: 50px;
            }

            .main-display {
                font-size: clamp(2.5rem, 18dvw, 4rem);
            }

            .modal-content {
                padding: 32px 24px 24px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="sequencer-container">
        <div class="status-text">Número sorteado</div>
        <div id="localDisplay" class="main-display">--</div>

        <button id="btnCreate" class="btn-game btn-dark">Sortear números</button>
        <button id="btnNext" class="btn-game btn-primary" disabled>Mostrar próximo</button>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-label">Número sorteado</div>
            <div class="modal-number" id="modalNumber">--</div>
            <button class="btn-close-modal" id="btnCloseModal">Fechar</button>
        </div>
    </div>

    <script>
        let numberSequence = [];
        let currentIndex = -1;

        const btnCreate = document.getElementById('btnCreate');
        const btnNext = document.getElementById('btnNext');
        const localDisplay = document.getElementById('localDisplay');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalNumber = document.getElementById('modalNumber');
        const btnCloseModal = document.getElementById('btnCloseModal');

        btnCreate.addEventListener('click', () => {
            numberSequence = Array.from({length: 101}, (_, i) => i);

            for (let i = numberSequence.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numberSequence[i], numberSequence[j]] = [numberSequence[j], numberSequence[i]];
            }

            currentIndex = -1;
            btnNext.disabled = false;
            localDisplay.innerText = "PRONTO";

            localStorage.setItem('gameTitle', 'Game Started!');
            localStorage.setItem('gameNumber', '--');
        });

        btnNext.addEventListener('click', () => {
            currentIndex++;

            if (currentIndex < numberSequence.length) {
                const nextNum = numberSequence[currentIndex];
                modalNumber.innerText = nextNum;
                modalOverlay.classList.add('active');
                localStorage.setItem('gameNumber', nextNum);
                localStorage.setItem('gameTitle', `Number #${currentIndex + 1}`);
            } else {
                localDisplay.innerText = "FINISH";
                btnNext.disabled = true;
                localStorage.setItem('gameTitle', 'GAME OVER');
            }
        });

        const closeModal = () => {
            modalOverlay.classList.remove('active');
        };

        btnCloseModal.addEventListener('click', closeModal);

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
    </script>
</body>
</html>
