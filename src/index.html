<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Game Controller</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100%;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .controller-container {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px;
            padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
        }

        h1 {
            color: #212529;
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 0.05em;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-wrapper label {
            color: #6c757d;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .input-wrapper input {
            width: 100%;
            padding: 18px 16px;
            border: 2px solid #dee2e6;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: 600;
            background: #fff;
            color: #212529;
            outline: none;
            transition: border-color 0.15s;
        }

        .input-wrapper input:focus {
            border-color: #0d6efd;
        }

        .input-wrapper input::placeholder {
            color: #adb5bd;
            font-weight: 400;
        }

        .btn-open-card {
            margin-top: 8px;
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            color: #fff;
            background: #0d6efd;
            cursor: pointer;
            transition: opacity 0.15s;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-open-card:active {
            opacity: 0.85;
        }

        @media (max-width: 480px) {
            .controller-container {
                padding: 32px 20px;
                padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
            }

            h1 {
                font-size: 2rem;
            }

            .input-wrapper input {
                padding: 16px 14px;
                font-size: 1rem;
                border-radius: 12px;
            }

            .btn-open-card {
                padding: 16px;
                font-size: 1.1rem;
                border-radius: 12px;
                min-height: 50px;
            }
        }
    </style>
</head>
<body>

    <div class="controller-container">
        <h1>ESCALA</h1>

        <div class="form-group">
            <div class="input-wrapper">
                <label for="inputTitle">Seu nome</label>
                <input type="text" id="inputTitle" placeholder="Digite seu nome">
            </div>

            <div class="input-wrapper">
                <label for="inputNumber">Número secreto</label>
                <input type="number" id="inputNumber" placeholder="0-100" max="100" min="0">
            </div>

            <a href="card.html" target="_blank" class="btn-open-card" id="enterBtn">
                Entrar no jogo
            </a>
        </div>

        <div></div>
    </div>

    <script>
        const inputTitle = document.getElementById('inputTitle');
        const inputNumber = document.getElementById('inputNumber');

        inputTitle.addEventListener('input', () => {
            localStorage.setItem('playerName', inputTitle.value);
            localStorage.setItem('gameTitle', inputTitle.value);
        });

        inputNumber.addEventListener('input', () => {
            localStorage.setItem('gameNumber', inputNumber.value);
        });
    </script>
</body>
</html>
