<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Full Screen Game Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: #000;
    }

    .game-card-fullscreen {
      height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      background: white;
      overflow: hidden;
    }

    #displayTitle {
      height: 10dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #6f42c1;
      color: white;
      font-weight: 800;
      text-transform: uppercase;
      font-size: clamp(1rem, 3.5dvh, 2rem);
      padding: 0 16px;
      text-align: center;
      flex-shrink: 0;
      line-height: 1.2;
    }

    #displayHint {
      flex: none;
      display: flex;
    }

    #displayHint textarea {
      width: 100%;
      height: 50dvh;
      resize: vertical;
      font-size: 1.6rem;
      border: none;
      border-radius: 0;
      padding: 16px;
      line-height: 1.5;
      outline: none;
    }

    .display-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      min-height: 60px;
    }

    #displayNumber {
      font-size: clamp(48px, 18dvh, 300px);
      font-weight: 900;
      color: #212529;
      line-height: 1;
    }

    .display-footer {
      display: flex;
      gap: 0;
      background-color: #fff;
      flex-shrink: 0;
      border-top: 1px solid #dee2e6;
    }

    .btn-game {
      flex: 1;
      font-size: clamp(0.9rem, 2.5dvh, 1.2rem);
      font-weight: bold;
      text-transform: uppercase;
      border: none;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.15s;
      border-radius: 0;
    }

    .btn-game:active {
      opacity: 0.8;
    }

    .modal-dialog {
      margin: 16px;
    }

    @media (max-width: 480px) {
      #displayHint textarea {
        font-size: 1.4rem;
        padding: 14px;
        height: 50dvh;
      }

      .btn-game {
        font-size: 0.8rem;
        min-height: 50px;
      }

      #displayTitle {
        font-size: clamp(0.8rem, 3dvh, 1.2rem);
        height: 8dvh;
        padding: 0 12px;
      }

      #displayNumber {
        font-size: clamp(28px, 10dvh, 120px);
      }
    }
  </style>
<script type="module" crossorigin src="./card-bx4fv0gb.js"></script></head>

<body>
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Revelar o valor?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Tem certeza que deseja revelar o valor?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="showBtn">Revelar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="game-card-fullscreen">
    <div id="displayTitle">WAITING FOR DATA...</div>
    <div id="displayHint">
      <textarea class="form-control" id="hintTextarea" rows="2" placeholder="Digite a sua dica aqui..."></textarea>
    </div>

    <div class="display-center">
      <span id="displayNumber">0</span>
    </div>

    <div class="display-footer">
      <button id="hideBtn" class="btn btn-success btn-game">Esconder</button>
      <button id="revelarBtn" hidden class="btn btn-danger btn-game" data-bs-toggle="modal"
        data-bs-target="#exampleModal">Revelar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>

  <script>
    const titleEl = document.getElementById('displayTitle')
    const numberEl = document.getElementById('displayNumber');
    const hintEl = document.getElementById('hintTextarea');
    const hideBtn = document.getElementById("hideBtn");
    const showBtn = document.getElementById("showBtn");
    const revelarBtn = document.getElementById("revelarBtn");

    const updateCard = () => {
      const storedPlayer = localStorage.getItem('playerName');
      const storedNumber = localStorage.getItem('gameNumber');
      const storedHint = localStorage.getItem('gameHint');

      if (storedPlayer !== null) titleEl.innerText = storedPlayer;
      if (storedNumber !== null && !numberEl.innerText.includes('?')) {
        numberEl.innerText = storedNumber;
      }
      if (storedHint !== null) hintEl.value = storedHint;
    };

    window.addEventListener('storage', (e) => {
      if (e.key === 'playerName' || e.key === 'gameNumber' || e.key === 'gameHint') {
        updateCard();
      }
    });

    hintEl.addEventListener('input', () => {
      localStorage.setItem('gameHint', hintEl.value);
    });

    updateCard();

    hideBtn.addEventListener('click', () => {
      numberEl.innerText = '?';
      hideBtn.hidden = true;
      revelarBtn.hidden = false;
    });

    showBtn.addEventListener('click', () => {
      const storedNumber = localStorage.getItem('gameNumber') || '0';
      numberEl.innerText = storedNumber;
      hideBtn.hidden = false;
      revelarBtn.hidden = true;
    });
  </script>
</body>

</html>
